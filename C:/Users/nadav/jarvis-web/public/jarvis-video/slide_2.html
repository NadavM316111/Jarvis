
<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1920px;
    height: 1080px;
    background: radial-gradient(ellipse at center, #0a1628 0%, #000508 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Orbitron', monospace;
    overflow: hidden;
    position: relative;
}
.grid {
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(0, 170, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 170, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    animation: gridMove 20s linear infinite;
}
@keyframes gridMove {
    0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
    100% { transform: perspective(500px) rotateX(60deg) translateY(50px); }
}
.particles {
    position: absolute;
    width: 100%;
    height: 100%;
}
.particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #00aaff;
    border-radius: 50%;
    box-shadow: 0 0 20px #00aaff, 0 0 40px #00aaff;
    animation: float 8s infinite ease-in-out;
}
@keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
    50% { transform: translateY(-100px) translateX(50px); opacity: 1; }
}
.arc-reactor {
    position: absolute;
    width: 300px;
    height: 300px;
    border: 3px solid rgba(0, 170, 255, 0.3);
    border-radius: 50%;
    animation: pulse 2s infinite ease-in-out;
}
.arc-reactor::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border: 2px solid rgba(0, 170, 255, 0.5);
    border-radius: 50%;
}
.arc-reactor::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, rgba(0, 170, 255, 0.8) 0%, transparent 70%);
    border-radius: 50%;
    box-shadow: 0 0 60px #00aaff, 0 0 120px #00aaff;
}
@keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.5; }
    50% { transform: scale(1.1); opacity: 0.8; }
}
.content {
    position: relative;
    z-index: 10;
    text-align: center;
}
.title {
    font-size: 120px;
    font-weight: 900;
    color: #00aaff;
    text-shadow: 0 0 30px #00aaff, 0 0 60px #00aaff, 0 0 90px #0066cc;
    letter-spacing: 20px;
    margin-bottom: 30px;
    animation: glowPulse 2s infinite;
}
@keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 30px #00aaff, 0 0 60px #00aaff, 0 0 90px #0066cc; }
    50% { text-shadow: 0 0 50px #00aaff, 0 0 100px #00aaff, 0 0 150px #0066cc; }
}
.subtitle {
    font-family: 'Rajdhani', sans-serif;
    font-size: 48px;
    font-weight: 300;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
    letter-spacing: 8px;
    text-transform: uppercase;
}
.scanline {
    position: absolute;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, transparent, #00aaff, transparent);
    animation: scan 3s infinite linear;
    opacity: 0.3;
}
@keyframes scan {
    0% { top: 0; }
    100% { top: 100%; }
}
.corner {
    position: absolute;
    width: 100px;
    height: 100px;
    border: 3px solid rgba(0, 170, 255, 0.5);
}
.corner.tl { top: 50px; left: 50px; border-right: none; border-bottom: none; }
.corner.tr { top: 50px; right: 50px; border-left: none; border-bottom: none; }
.corner.bl { bottom: 50px; left: 50px; border-right: none; border-top: none; }
.corner.br { bottom: 50px; right: 50px; border-left: none; border-top: none; }
.slide-number {
    position: absolute;
    bottom: 60px;
    right: 80px;
    font-size: 24px;
    color: rgba(0, 170, 255, 0.6);
    letter-spacing: 5px;
}
</style>
</head>
