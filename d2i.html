<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>D2I — Dress to Impress · JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{--cyan:#00f5ff;--green:#00ff88;--gold:#f59e0b;--red:#ff4444;--dark:#02040a;--panel:rgba(4,8,18,0.94);--border:rgba(0,245,255,0.12);--border2:rgba(0,245,255,0.3);--text:rgba(255,255,255,0.88);--sub:rgba(255,255,255,0.36);}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;height:100dvh;background:var(--dark);font-family:'Syne',sans-serif;overflow:hidden;color:var(--text);}

/* ── LAYERS ── */
#cam-wrap{position:fixed;inset:0;z-index:1;background:#000;transition:filter 0.5s ease;}
#cam-wrap.dimmed{filter:brightness(0.25) saturate(0.4);}
#cam{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1);}
#cam-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 40%,rgba(0,245,255,0.04),transparent 70%),var(--dark);}
.ph-icon{font-size:52px;opacity:0.12;}
.ph-text{font-size:10px;letter-spacing:4px;color:var(--sub);text-transform:uppercase;font-family:'Space Mono',monospace;}

/* Still frame (frozen after scan) */
#still-wrap{position:fixed;inset:0;z-index:2;display:none;}
#still-img{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1);}

/* Canvas for circles */
#overlay{position:fixed;inset:0;z-index:10;pointer-events:none;}

/* Scan line */
#scan-line{position:fixed;left:0;right:0;height:2px;z-index:20;display:none;top:0;
  background:linear-gradient(90deg,transparent,rgba(0,245,255,0.3) 20%,var(--cyan) 50%,rgba(0,245,255,0.3) 80%,transparent);
  box-shadow:0 0 14px var(--cyan),0 0 30px rgba(0,245,255,0.4);}
#scan-line.active{display:block;animation:scanDown 2s ease-in-out forwards;}
@keyframes scanDown{0%{top:0;opacity:1}85%{opacity:1}100%{top:100%;opacity:0}}

/* Corner marks */
.corner{position:fixed;width:18px;height:18px;z-index:15;pointer-events:none;}
.corner::before,.corner::after{content:'';position:absolute;background:rgba(0,245,255,0.3);}
.corner::before{width:100%;height:1px;top:0;left:0;}
.corner::after{width:1px;height:100%;top:0;left:0;}
.c-tl{top:52px;left:14px}.c-tr{top:52px;right:14px;transform:scaleX(-1)}.c-bl{bottom:175px;left:14px;transform:scaleY(-1)}.c-br{bottom:175px;right:14px;transform:scale(-1,-1)}

/* ── TOP BAR ── */
#topbar{position:fixed;top:0;left:0;right:0;z-index:50;height:52px;display:flex;align-items:center;padding:0 16px;gap:10px;background:linear-gradient(180deg,rgba(2,4,10,0.96) 0%,transparent 100%);}
#logo{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:5px;color:var(--cyan);font-weight:700;}
#logo-sub{font-size:7px;letter-spacing:3px;color:var(--sub);text-transform:uppercase;font-family:'Space Mono',monospace;}
.top-spacer{flex:1;}
#mode-tabs{display:flex;gap:2px;}
.mode-tab{padding:5px 11px;border-radius:14px;font-size:8px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:1px solid transparent;color:var(--sub);background:transparent;font-family:'Space Mono',monospace;transition:all 0.2s;}
.mode-tab.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,245,255,0.07);}
#status-pill{padding:4px 10px;border-radius:20px;font-size:7.5px;letter-spacing:2px;text-transform:uppercase;font-family:'Space Mono',monospace;border:1px solid var(--border);color:var(--sub);background:transparent;transition:all 0.3s;white-space:nowrap;}
#status-pill.scanning{border-color:var(--cyan);color:var(--cyan);background:rgba(0,245,255,0.07);}
#status-pill.done{border-color:var(--green);color:var(--green);background:rgba(0,255,136,0.07);}
#cam-btn{width:30px;height:30px;border-radius:8px;background:rgba(0,245,255,0.08);border:1px solid var(--border);color:var(--cyan);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* ── BOTTOM PANEL ── */
#bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:12px 14px calc(12px + env(safe-area-inset-bottom)) 14px;background:linear-gradient(0deg,rgba(2,4,10,0.98) 0%,rgba(2,4,10,0.65) 70%,transparent 100%);display:flex;flex-direction:column;gap:9px;transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);}
#bottom.hidden{transform:translateY(120%);}
#chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;}
#chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;padding:4px 11px;border-radius:20px;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);color:var(--sub);background:transparent;font-family:'Space Mono',monospace;transition:all 0.15s;white-space:nowrap;}
.chip:hover,.chip.active{border-color:var(--cyan);color:var(--cyan);background:rgba(0,245,255,0.07);}
#input-row{display:flex;gap:7px;align-items:center;}
#event-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:11px;padding:10px 13px;font-family:'Syne',sans-serif;font-size:14px;color:var(--text);outline:none;caret-color:var(--cyan);transition:border-color 0.2s;}
#event-input:focus{border-color:var(--border2);}
#event-input::placeholder{color:var(--sub);font-size:12px;}
#scan-btn{padding:10px 18px;border-radius:11px;font-size:8.5px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:1px solid var(--cyan);color:#000;background:var(--cyan);font-family:'Space Mono',monospace;font-weight:700;transition:all 0.2s;white-space:nowrap;flex-shrink:0;}
#scan-btn:hover{background:#00e0ea;}
#scan-btn:disabled{opacity:0.3;cursor:default;color:var(--cyan);background:transparent;}
#mic-btn{width:40px;height:40px;border-radius:11px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
#mic-btn.active{border-color:var(--red);color:var(--red);background:rgba(255,68,68,0.1);animation:micPulse 1s ease-in-out infinite;}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,68,68,0.4)}50%{box-shadow:0 0 0 8px rgba(255,68,68,0)}}

/* ── TRY-ON PANEL ── */
#tryon-panel{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:16px 14px calc(16px + env(safe-area-inset-bottom)) 14px;background:linear-gradient(0deg,rgba(2,4,10,0.98) 0%,rgba(2,4,10,0.65) 70%,transparent 100%);display:none;flex-direction:column;gap:10px;transition:transform 0.45s cubic-bezier(0.4,0,0.2,1);}
#tryon-panel.visible{display:flex;}
#tryon-panel.hidden{transform:translateY(120%);}
.upload-zone{border:1px dashed rgba(0,245,255,0.25);border-radius:13px;padding:18px 14px;text-align:center;cursor:pointer;transition:all 0.2s;background:rgba(0,245,255,0.02);position:relative;overflow:hidden;}
.upload-zone:hover{border-color:var(--cyan);background:rgba(0,245,255,0.05);}
.upload-zone.loaded{border-style:solid;border-color:var(--cyan);}
.upload-zone-label{font-size:9px;letter-spacing:2px;color:var(--sub);text-transform:uppercase;font-family:'Space Mono',monospace;margin-top:6px;}
.upload-preview{width:100%;max-height:80px;object-fit:contain;display:none;border-radius:8px;}
.upload-preview.show{display:block;}
#tryon-actions{display:flex;gap:7px;}
#tryon-scan-btn{flex:1;padding:11px;font-size:8.5px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border:1px solid var(--cyan);color:#000;background:var(--cyan);border-radius:11px;font-family:'Space Mono',monospace;font-weight:700;transition:all 0.2s;}
#tryon-scan-btn:disabled{opacity:0.3;cursor:default;color:var(--cyan);background:transparent;}
#tryon-cancel{padding:11px 16px;font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);color:var(--sub);background:transparent;border-radius:11px;font-family:'Space Mono',monospace;transition:all 0.2s;}
#tryon-cancel:hover{border-color:var(--border2);color:var(--text);}

/* ── RESULT CARD ── */
#result-card{position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--panel);border-top:1px solid var(--border2);backdrop-filter:blur(28px);padding:18px 18px 0 18px;transform:translateY(100%);transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);max-height:72dvh;overflow-y:auto;}
#result-card.show{transform:translateY(0);}
#result-card::-webkit-scrollbar{width:2px;}
#result-card::-webkit-scrollbar-thumb{background:var(--border2);}

.card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px;}
#outfit-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 7px;border-radius:20px;background:rgba(0,245,255,0.1);border:1px solid rgba(0,245,255,0.3);}
.badge-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);}
#outfit-name{font-size:9px;letter-spacing:2px;color:var(--cyan);text-transform:uppercase;font-family:'Space Mono',monospace;}
.card-close-row{display:flex;gap:6px;flex-shrink:0;}
.card-icon-btn{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all 0.15s;}
.card-icon-btn:hover{background:rgba(255,255,255,0.1);color:var(--text);}
#close-btn:hover{background:rgba(255,50,50,0.1);color:rgba(255,100,100,0.8);}
#rec-text{font-size:14px;line-height:1.75;color:var(--text);margin-bottom:10px;font-weight:300;}
#tip-row{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.2);border-radius:9px;margin-bottom:12px;}
.tip-icon{font-size:12px;flex-shrink:0;margin-top:1px;}
#tip-text{font-size:11px;color:rgba(245,158,11,0.85);line-height:1.6;}
.card-actions{display:flex;gap:7px;margin-bottom:14px;}
.card-action{flex:1;padding:9px 6px;border-radius:9px;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;text-align:center;font-family:'Space Mono',monospace;}
.ca-secondary{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--sub);}
.ca-secondary:hover{border-color:var(--border2);color:var(--text);}
.ca-primary{background:rgba(0,245,255,0.12);border:1px solid rgba(0,245,255,0.3);color:var(--cyan);}
.ca-primary:hover{background:rgba(0,245,255,0.22);}

/* ── CHAT (in result card) ── */
#chat-section{border-top:1px solid var(--border);padding:14px 0 calc(14px + env(safe-area-inset-bottom)) 0;}
.chat-label{font-size:7.5px;letter-spacing:3px;color:var(--sub);text-transform:uppercase;font-family:'Space Mono',monospace;margin-bottom:10px;}
#chat-msgs{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;max-height:160px;overflow-y:auto;}
#chat-msgs::-webkit-scrollbar{width:2px;}
.chat-bubble{max-width:88%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.6;}
.chat-bubble.user{align-self:flex-end;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:var(--text);border-radius:14px 14px 4px 14px;}
.chat-bubble.ai{align-self:flex-start;background:rgba(0,245,255,0.06);border:1px solid var(--border);color:var(--text);border-radius:14px 14px 14px 4px;}
#chat-input-row{display:flex;gap:7px;align-items:center;}
#chat-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:11px;padding:10px 13px;font-family:'Syne',sans-serif;font-size:14px;color:var(--text);outline:none;caret-color:var(--cyan);transition:border-color 0.2s;}
#chat-input:focus{border-color:var(--border2);}
#chat-input::placeholder{color:var(--sub);font-size:12px;}
#chat-send{width:38px;height:38px;border-radius:10px;background:rgba(0,245,255,0.12);border:1px solid var(--border2);color:var(--cyan);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#chat-mic{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
#chat-mic.active{border-color:var(--red);color:var(--red);background:rgba(255,68,68,0.1);}

/* ── TRY-ON RESULT ── */
#tryon-result{position:fixed;bottom:0;left:0;right:0;z-index:70;background:var(--panel);border-top:1px solid var(--border2);backdrop-filter:blur(28px);padding:20px 18px calc(20px + env(safe-area-inset-bottom)) 18px;transform:translateY(100%);transition:transform 0.5s cubic-bezier(0.4,0,0.2,1);max-height:80dvh;overflow-y:auto;}
#tryon-result.show{transform:translateY(0);}
#tryon-comparison{display:flex;gap:10px;margin-bottom:14px;}
.tryon-img-card{flex:1;border-radius:12px;overflow:hidden;border:1px solid var(--border);position:relative;}
.tryon-img-card img{width:100%;height:140px;object-fit:cover;display:block;}
.tryon-img-label{position:absolute;bottom:0;left:0;right:0;padding:6px 10px;background:rgba(2,4,10,0.85);font-size:8px;letter-spacing:2px;color:var(--sub);text-transform:uppercase;font-family:'Space Mono',monospace;}
#tryon-rec{font-size:14px;line-height:1.75;color:var(--text);margin-bottom:10px;font-weight:300;}
#tryon-tagline{font-size:11px;color:var(--sub);font-style:italic;margin-bottom:16px;letter-spacing:0.3px;}
.tryon-actions{display:flex;gap:7px;}

/* ── TOAST ── */
#toast{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:rgba(2,4,10,0.95);border:1px solid var(--border2);padding:7px 16px;border-radius:9px;font-size:9px;letter-spacing:1.5px;font-family:'Space Mono',monospace;color:var(--cyan);text-transform:uppercase;opacity:0;transition:opacity 0.25s;pointer-events:none;z-index:200;white-space:nowrap;}
#toast.show{opacity:1;}

/* ── ITEM COUNT ── */
#item-count{position:fixed;top:62px;right:14px;z-index:40;padding:4px 9px;border-radius:7px;font-size:7.5px;letter-spacing:1.5px;font-family:'Space Mono',monospace;color:var(--sub);background:rgba(2,4,10,0.85);border:1px solid var(--border);opacity:0;transition:opacity 0.3s;backdrop-filter:blur(8px);}
#item-count.visible{opacity:1;}

/* ── SPEAKING ── */
#speaking{position:fixed;bottom:195px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 14px;background:rgba(0,245,255,0.08);border:1px solid var(--border2);border-radius:20px;font-size:8px;letter-spacing:2px;color:var(--cyan);text-transform:uppercase;font-family:'Space Mono',monospace;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:55;white-space:nowrap;}
#speaking.visible{opacity:1;}
.speak-bars{display:flex;gap:2px;align-items:center;}
.speak-bar{width:2px;border-radius:2px;background:var(--cyan);animation:speakBar 0.6s ease-in-out infinite;}
.speak-bar:nth-child(1){height:7px;animation-delay:0s}
.speak-bar:nth-child(2){height:13px;animation-delay:0.1s}
.speak-bar:nth-child(3){height:9px;animation-delay:0.2s}
.speak-bar:nth-child(4){height:15px;animation-delay:0.05s}
.speak-bar:nth-child(5){height:7px;animation-delay:0.15s}
@keyframes speakBar{0%,100%{transform:scaleY(0.4)}50%{transform:scaleY(1)}}
</style>
</head>
<body>

<!-- Live camera -->
<div id="cam-wrap">
  <video id="cam" autoplay playsinline muted></video>
  <div id="cam-placeholder">
    <div class="ph-icon">👔</div>
    <div class="ph-text">Point at your wardrobe</div>
  </div>
</div>

<!-- Still frame (frozen after scan) -->
<div id="still-wrap"><img id="still-img" alt="scan"></div>

<!-- Canvas overlay for circles -->
<canvas id="overlay"></canvas>

<!-- Scan line animation -->
<div id="scan-line"></div>

<!-- Corner marks -->
<div class="corner c-tl"></div><div class="corner c-tr"></div>
<div class="corner c-bl"></div><div class="corner c-br"></div>

<!-- TOP BAR -->
<div id="topbar">
  <div>
    <div id="logo">D2I</div>
    <div id="logo-sub">Dress to Impress</div>
  </div>
  <div class="top-spacer"></div>
  <div id="mode-tabs">
    <button class="mode-tab active" onclick="setMode('scan')">Scan</button>
    <button class="mode-tab" onclick="setMode('tryon')">Try-On</button>
  </div>
  <div id="status-pill">Ready</div>
  <button id="cam-btn" onclick="startCam()" title="Camera">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
  </button>
</div>

<!-- Item count badge -->
<div id="item-count">0 items</div>

<!-- SCAN BOTTOM PANEL -->
<div id="bottom">
  <div id="chips">
    <div class="chip" onclick="setEvent(this,'School')">School</div>
    <div class="chip" onclick="setEvent(this,'Job interview')">Interview</div>
    <div class="chip" onclick="setEvent(this,'Date night')">Date</div>
    <div class="chip" onclick="setEvent(this,'Casual hangout')">Casual</div>
    <div class="chip" onclick="setEvent(this,'Gym / workout')">Gym</div>
    <div class="chip" onclick="setEvent(this,'Formal event')">Formal</div>
    <div class="chip" onclick="setEvent(this,'Beach / outdoors')">Outdoors</div>
    <div class="chip" onclick="setEvent(this,'Work from home')">WFH</div>
  </div>
  <div id="input-row">
    <input id="event-input" placeholder="What's the occasion?" autocomplete="off" spellcheck="false">
    <button id="mic-btn" onclick="toggleMic()" title="Voice input">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <button id="scan-btn" onclick="doScan()">Scan →</button>
  </div>
</div>

<!-- TRY-ON BOTTOM PANEL -->
<div id="tryon-panel">
  <div style="font-size:9px;letter-spacing:2.5px;color:var(--sub);text-transform:uppercase;font-family:'Space Mono',monospace;">Upload clothing → Scan yourself</div>
  <div class="upload-zone" id="upload-zone" onclick="document.getElementById('clothing-input').click()">
    <input type="file" id="clothing-input" accept="image/*" style="display:none" onchange="loadClothing(this)">
    <img class="upload-preview" id="clothing-preview" alt="clothing">
    <div id="upload-placeholder">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(0,245,255,0.4)" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <div class="upload-zone-label" style="margin-top:6px">Tap to upload clothing from Amazon</div>
    </div>
  </div>
  <div id="tryon-actions">
    <button id="tryon-scan-btn" onclick="doTryOn()" disabled>Scan me →</button>
    <button id="tryon-cancel" onclick="setMode('scan')">Cancel</button>
  </div>
</div>

<!-- RESULT CARD -->
<div id="result-card">
  <div class="card-top">
    <div id="outfit-badge">
      <div class="badge-dot"></div>
      <div id="outfit-name">Recommended outfit</div>
    </div>
    <div class="card-close-row">
      <button class="card-icon-btn" onclick="saveSnapshot()" title="Save screenshot">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0018 9h-1.26A8 8 0 103 16.29"/></svg>
      </button>
      <button class="card-icon-btn" onclick="speakResult()" title="Play again">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
      </button>
      <button class="card-icon-btn" id="close-btn" onclick="resetScan()">✕</button>
    </div>
  </div>
  <div id="rec-text"></div>
  <div id="tip-row" style="display:none">
    <div class="tip-icon">💡</div>
    <div id="tip-text"></div>
  </div>
  <div class="card-actions">
    <div class="card-action ca-secondary" onclick="resetScan()">Scan again</div>
    <div class="card-action ca-secondary" onclick="setMode('tryon')">Try-On mode</div>
  </div>
  <!-- Chat with JARVIS about the outfit -->
  <div id="chat-section">
    <div class="chat-label">Ask JARVIS</div>
    <div id="chat-msgs"></div>
    <div id="chat-input-row">
      <input id="chat-input" placeholder="Ask about this outfit..." spellcheck="false" autocomplete="off">
      <button id="chat-mic" onclick="toggleChatMic()" title="Voice">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/></svg>
      </button>
      <button id="chat-send" onclick="sendChat()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- TRY-ON RESULT -->
<div id="tryon-result">
  <div class="card-top">
    <div id="outfit-badge" style="background:rgba(167,139,250,0.1);border-color:rgba(167,139,250,0.3)">
      <div class="badge-dot" style="background:#a855f7;box-shadow:0 0 8px #a855f7"></div>
      <div style="font-size:9px;letter-spacing:2px;color:#a855f7;text-transform:uppercase;font-family:'Space Mono',monospace;">Virtual Try-On</div>
    </div>
    <button class="card-icon-btn" id="tryon-close-btn" onclick="resetTryOn()">✕</button>
  </div>
  <div id="tryon-comparison">
    <div class="tryon-img-card">
      <img id="tryon-clothing-img" alt="clothing">
      <div class="tryon-img-label">The Item</div>
    </div>
    <div class="tryon-img-card">
      <img id="tryon-self-img" alt="you" style="transform:scaleX(-1)">
      <div class="tryon-img-label">You</div>
    </div>
  </div>
  <div id="tryon-rec"></div>
  <div id="tryon-tagline"></div>
  <div class="tryon-actions">
    <div class="card-action ca-secondary" style="flex:1" onclick="resetTryOn()">Try another</div>
    <div class="card-action ca-primary" style="flex:1" onclick="speakTryOn()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:3px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 010 14.14"/></svg>
      Hear it
    </div>
  </div>
</div>

<!-- Speaking indicator -->
<div id="speaking">
  <div class="speak-bars">
    <div class="speak-bar"></div><div class="speak-bar"></div>
    <div class="speak-bar"></div><div class="speak-bar"></div><div class="speak-bar"></div>
  </div>
  JARVIS speaking
</div>

<div id="toast"></div>

<script>
const API = 'https://api.heyjarvis.me';
let camStream = null, camOn = false;
let lastResult = null, lastTryOnResult = null;
let stillFrameData = null, selfFrameData = null;
let clothingImageData = null;
let currentMode = 'scan';
let toastT, micRec = null, chatMicRec = null;

// ── TOAST ──────────────────────────────────────────────────────
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── OVERLAY ────────────────────────────────────────────────────
const overlay = document.getElementById('overlay');
function resizeOverlay() { overlay.width = window.innerWidth; overlay.height = window.innerHeight; }
window.addEventListener('resize', resizeOverlay);
resizeOverlay();

// ── CAMERA ─────────────────────────────────────────────────────
async function startCam() {
  if (camOn) return;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const vid = document.getElementById('cam');
    vid.srcObject = camStream;
    document.getElementById('cam-placeholder').style.display = 'none';
    document.getElementById('cam-btn').style.borderColor = 'rgba(0,245,255,0.5)';
    camOn = true;
    toast('Camera ready');
  } catch(e) { toast('Camera access denied'); }
}
window.addEventListener('load', startCam);

// ── CAPTURE FRAME ──────────────────────────────────────────────
function captureFrame() {
  const vid = document.getElementById('cam');
  const cvs = document.createElement('canvas');
  cvs.width = vid.videoWidth || 1280;
  cvs.height = vid.videoHeight || 720;
  const ctx = cvs.getContext('2d');
  // Draw unmirrored for AI (AI sees natural orientation)
  ctx.drawImage(vid, 0, 0, cvs.width, cvs.height);
  return cvs.toDataURL('image/jpeg', 0.84).split(',')[1];
}

function showStillFrame(base64) {
  const img = document.getElementById('still-img');
  img.src = 'data:image/jpeg;base64,' + base64;
  document.getElementById('still-wrap').style.display = 'block';
  document.getElementById('cam-wrap').classList.add('dimmed');
}

function hideStillFrame() {
  document.getElementById('still-wrap').style.display = 'none';
  document.getElementById('cam-wrap').classList.remove('dimmed');
}

// ── MODE ───────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach((t, i) => t.classList.toggle('active', (i === 0) === (mode === 'scan')));
  document.getElementById('bottom').classList.toggle('hidden', mode !== 'scan');
  const tp = document.getElementById('tryon-panel');
  tp.style.display = mode === 'tryon' ? 'flex' : 'none';
  if (mode === 'tryon') toast('Upload clothing, then scan yourself');
}

// ── EVENT CHIPS ────────────────────────────────────────────────
function setEvent(el, text) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('event-input').value = text;
}

// ── STATUS ─────────────────────────────────────────────────────
function setStatus(text, cls) {
  const el = document.getElementById('status-pill');
  el.textContent = text;
  el.className = cls ? `status-pill ${cls}` : 'status-pill';
  el.id = 'status-pill';
}

// ── SCAN ───────────────────────────────────────────────────────
async function doScan() {
  if (!camOn) { await startCam(); await new Promise(r => setTimeout(r, 700)); }
  const event = document.getElementById('event-input').value.trim() || 'casual day';
  const btn = document.getElementById('scan-btn');
  btn.disabled = true;

  // Capture still frame IMMEDIATELY before scan line
  stillFrameData = captureFrame();
  setStatus('Scanning...', 'scanning');

  // Scan line animation
  const line = document.getElementById('scan-line');
  line.classList.remove('active');
  void line.offsetWidth;
  line.classList.add('active');
  await new Promise(r => setTimeout(r, 2200));
  setStatus('Analyzing...', 'scanning');

  // Show still frame now
  showStillFrame(stillFrameData);

  try {
    const token = localStorage.getItem('jarvis_token') || '';
    const res = await fetch(`${API}/d2i-analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ image: stillFrameData, event })
    });
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    lastResult = data;
    showResult(data);
  } catch(e) {
    toast('Analysis failed — try again');
    console.error('[D2I]', e);
    hideStillFrame();
    setStatus('Ready', '');
  }
  btn.disabled = false;
}

// ── SHOW RESULT ────────────────────────────────────────────────
function showResult(data) {
  drawAnnotations(data.items || []);
  document.getElementById('bottom').classList.add('hidden');
  document.getElementById('outfit-name').textContent = data.outfit || 'Recommended outfit';
  document.getElementById('rec-text').textContent = data.voiceline || '';
  const tipEl = document.getElementById('tip-row');
  if (data.tip) {
    document.getElementById('tip-text').textContent = data.tip;
    tipEl.style.display = 'flex';
  } else {
    tipEl.style.display = 'none';
  }
  const cnt = (data.items || []).length;
  const countEl = document.getElementById('item-count');
  countEl.textContent = `${cnt} item${cnt !== 1 ? 's' : ''} spotted`;
  countEl.classList.add('visible');
  document.getElementById('result-card').classList.add('show');
  setStatus('Done', 'done');
  speakResult();
}

// ── ANNOTATIONS — no wrong labels, just visual markers ─────────
function drawAnnotations(items) {
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  const W = overlay.width, H = overlay.height;

  items.forEach(item => {
    // Flip x because still frame is shown mirrored (scaleX(-1))
    const x = (1 - item.x) * W;
    const y = item.y * H;
    const r = Math.min(W, H) * 0.072;
    const rec = item.recommended;

    if (rec) {
      // Glowing cyan ring
      ctx.shadowBlur = 28;
      ctx.shadowColor = 'rgba(0,245,255,0.7)';
      ctx.strokeStyle = '#00f5ff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Inner filled circle
      ctx.beginPath();
      ctx.arc(x, y, r * 0.28, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,245,255,0.9)';
      ctx.fill();

      // "WEAR THIS" pill below
      const pillText = 'WEAR THIS';
      ctx.font = 'bold 10px "Space Mono", monospace';
      const tw = ctx.measureText(pillText).width;
      const px = x - tw / 2 - 8, py = y + r + 8;
      const pw = tw + 16, ph = 20;
      ctx.fillStyle = 'rgba(0,245,255,0.92)';
      roundRect(ctx, px, py, pw, ph, 4);
      ctx.fill();
      ctx.fillStyle = '#02040a';
      ctx.fillText(pillText, px + 8, py + 13.5);
    } else {
      // Dim grey ring, no label
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,0.18)';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(x, y, r * 0.7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ── SAVE SNAPSHOT ──────────────────────────────────────────────
function saveSnapshot() {
  // Composite still frame + circles into one image and download
  const img = document.getElementById('still-img');
  const cvs = document.createElement('canvas');
  cvs.width = overlay.width; cvs.height = overlay.height;
  const ctx = cvs.getContext('2d');
  // Draw still frame (mirrored to match display)
  ctx.save(); ctx.scale(-1, 1); ctx.drawImage(img, -cvs.width, 0, cvs.width, cvs.height); ctx.restore();
  // Draw circles overlay
  ctx.drawImage(overlay, 0, 0);
  const a = document.createElement('a');
  a.download = 'd2i-outfit.png';
  a.href = cvs.toDataURL('image/png');
  a.click();
  toast('Snapshot saved');
}

// ── SPEAK ──────────────────────────────────────────────────────
function speakText(text) {
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.rate = 0.92; utt.pitch = 1.0; utt.volume = 1;
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v => v.name.includes('Samantha') || v.name.includes('Daniel') || (v.lang === 'en-US' && v.localService));
  if (preferred) utt.voice = preferred;
  const el = document.getElementById('speaking');
  el.classList.add('visible');
  utt.onend = utt.onerror = () => el.classList.remove('visible');
  window.speechSynthesis.speak(utt);
}
function speakResult() { if (lastResult) speakText(lastResult.voiceline || ''); }
function speakTryOn() { if (lastTryOnResult) speakText(lastTryOnResult.voiceline || ''); }
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

// ── VOICE INPUT (for event field) ──────────────────────────────
function toggleMic() {
  const btn = document.getElementById('mic-btn');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice not supported on this browser'); return; }
  if (micRec) {
    micRec.stop(); micRec = null;
    btn.classList.remove('active'); return;
  }
  micRec = new SR();
  micRec.lang = 'en-US'; micRec.continuous = false; micRec.interimResults = false;
  micRec.onresult = e => {
    const text = e.results[0][0].transcript;
    document.getElementById('event-input').value = text;
    btn.classList.remove('active'); micRec = null;
  };
  micRec.onend = () => { btn.classList.remove('active'); micRec = null; };
  micRec.onerror = () => { btn.classList.remove('active'); micRec = null; toast('Mic error'); };
  micRec.start();
  btn.classList.add('active');
  toast('Listening... describe the event');
}

// ── CHAT ───────────────────────────────────────────────────────
function addChatBubble(text, role) {
  const msgs = document.getElementById('chat-msgs');
  const div = document.createElement('div');
  div.className = `chat-bubble ${role}`;
  div.textContent = text;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

async function sendChat(text) {
  const input = document.getElementById('chat-input');
  const msg = text || input.value.trim();
  if (!msg) return;
  input.value = '';
  addChatBubble(msg, 'user');

  const context = lastResult ? `The user's scan showed: ${lastResult.voiceline || ''}. Outfit: ${lastResult.outfit || ''}. Event: ${lastResult.event || 'casual'}.` : '';
  const token = localStorage.getItem('jarvis_token') || '';

  // Send still frame + question to d2i-analyze
  try {
    const body = { image: stillFrameData, event: msg, context };
    const res = await fetch(`${API}/d2i-chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify(body)
    });
    // Fallback to regular chat if d2i-chat not available
    const data = await res.json().catch(() => ({}));
    const reply = data.reply || data.message || "Let me think about that outfit choice for you.";
    addChatBubble(reply, 'ai');
    speakText(reply);
  } catch(e) {
    const reply = "Try asking JARVIS in the main chat for more style advice!";
    addChatBubble(reply, 'ai');
  }
}

function toggleChatMic() {
  const btn = document.getElementById('chat-mic');
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Voice not supported'); return; }
  if (chatMicRec) {
    chatMicRec.stop(); chatMicRec = null;
    btn.classList.remove('active'); return;
  }
  chatMicRec = new SR();
  chatMicRec.lang = 'en-US'; chatMicRec.continuous = false; chatMicRec.interimResults = false;
  chatMicRec.onresult = e => {
    const text = e.results[0][0].transcript;
    btn.classList.remove('active'); chatMicRec = null;
    sendChat(text);
  };
  chatMicRec.onend = () => { btn.classList.remove('active'); chatMicRec = null; };
  chatMicRec.onerror = () => { btn.classList.remove('active'); chatMicRec = null; };
  chatMicRec.start();
  btn.classList.add('active');
}

// ── TRY-ON ─────────────────────────────────────────────────────
function loadClothing(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const base64 = e.target.result.split(',')[1];
    clothingImageData = base64;
    const preview = document.getElementById('clothing-preview');
    preview.src = e.target.result;
    preview.classList.add('show');
    document.getElementById('upload-placeholder').style.display = 'none';
    document.getElementById('upload-zone').classList.add('loaded');
    document.getElementById('tryon-scan-btn').disabled = false;
    toast('Clothing loaded — now hit Scan Me');
  };
  reader.readAsDataURL(file);
}

async function doTryOn() {
  if (!clothingImageData) { toast('Upload clothing first'); return; }
  if (!camOn) { await startCam(); await new Promise(r => setTimeout(r, 700)); }
  const btn = document.getElementById('tryon-scan-btn');
  btn.disabled = true;
  setStatus('Scanning you...', 'scanning');

  const line = document.getElementById('scan-line');
  line.classList.remove('active'); void line.offsetWidth; line.classList.add('active');
  await new Promise(r => setTimeout(r, 2200));

  selfFrameData = captureFrame();
  showStillFrame(selfFrameData);
  setStatus('Analyzing fit...', 'scanning');

  try {
    const token = localStorage.getItem('jarvis_token') || '';
    const res = await fetch(`${API}/d2i-tryon`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ clothingImage: clothingImageData, bodyImage: selfFrameData })
    });
    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    lastTryOnResult = data;
    showTryOnResult(data);
  } catch(e) {
    toast('Try-on failed — check connection');
    console.error('[D2I TryOn]', e);
    hideStillFrame();
    setStatus('Ready', '');
  }
  btn.disabled = false;
}

function showTryOnResult(data) {
  // Set images
  document.getElementById('tryon-clothing-img').src = `data:image/jpeg;base64,${clothingImageData}`;
  document.getElementById('tryon-self-img').src = `data:image/jpeg;base64,${selfFrameData}`;
  document.getElementById('tryon-rec').textContent = data.voiceline || data.description || '';
  document.getElementById('tryon-tagline').textContent = data.tagline || 'Is it the modal, or is it the clothes?';
  document.getElementById('tryon-result').classList.add('show');
  document.getElementById('tryon-panel').classList.add('hidden');
  setStatus('Done', 'done');
  speakTryOn();
}

function resetTryOn() {
  window.speechSynthesis.cancel();
  document.getElementById('speaking').classList.remove('visible');
  document.getElementById('tryon-result').classList.remove('show');
  document.getElementById('tryon-panel').classList.remove('hidden');
  hideStillFrame();
  setStatus('Ready', '');
  lastTryOnResult = null;
}

// ── RESET ──────────────────────────────────────────────────────
function resetScan() {
  window.speechSynthesis.cancel();
  document.getElementById('speaking').classList.remove('visible');
  document.getElementById('result-card').classList.remove('show');
  document.getElementById('bottom').classList.remove('hidden');
  document.getElementById('item-count').classList.remove('visible');
  document.getElementById('chat-msgs').innerHTML = '';
  hideStillFrame();
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  setStatus('Ready', '');
  lastResult = null; stillFrameData = null;
}

// ── KEYBOARD SHORTCUTS ─────────────────────────────────────────
document.getElementById('event-input').addEventListener('keydown', e => { if (e.key === 'Enter') doScan(); });
document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
</script>
</body>
</html>
