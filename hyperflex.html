<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYPERFLEX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: #000;
  font-family: 'DM Sans', sans-serif;
  overflow: hidden;
  height: 100vh;
  color: white;
}

#canvas { position: fixed; inset: 0; width: 100%; height: 100%; }

/* ── CORNER MARKS ── */
.corner {
  position: fixed;
  width: 18px; height: 18px;
  z-index: 10; pointer-events: none;
}
.corner::before, .corner::after {
  content: ''; position: absolute;
  background: rgba(0,245,255,0.5);
}
.corner::before { width: 100%; height: 1px; top: 0; left: 0; }
.corner::after  { width: 1px; height: 100%; top: 0; left: 0; }
.c-tl { top: 20px; left: 20px; }
.c-tr { top: 20px; right: 20px; transform: scaleX(-1); }
.c-bl { bottom: 90px; left: 20px; transform: scaleY(-1); }
.c-br { bottom: 90px; right: 20px; transform: scale(-1,-1); }

/* ── TOP ── */
#top {
  position: fixed; top: 0; left: 0; right: 0;
  height: 52px; z-index: 50;
  display: flex; align-items: center;
  padding: 0 24px; gap: 20px;
  background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
}
#logo {
  font-size: 13px; letter-spacing: 6px;
  color: rgba(0,245,255,0.8); font-weight: 300;
  text-transform: uppercase;
}
#status {
  font-size: 10px; letter-spacing: 3px;
  color: rgba(255,255,255,0.2);
  text-transform: uppercase;
  margin-left: auto;
}

/* ── BOTTOM BAR ── */
#bottom {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 72px; z-index: 50;
  display: flex; align-items: center;
  padding: 0 20px; gap: 12px;
  background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, transparent 100%);
}

#input-wrap {
  flex: 1;
  display: flex; align-items: center; gap: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 0 16px;
  height: 44px;
  max-width: 640px;
  margin: 0 auto;
}
#input-wrap:focus-within {
  border-color: rgba(0,245,255,0.3);
  background: rgba(0,245,255,0.04);
}
#prefix {
  font-size: 11px; color: rgba(0,245,255,0.5);
  letter-spacing: 1px; flex-shrink: 0;
}
#prompt {
  flex: 1; background: none; border: none; outline: none;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; color: white;
  caret-color: rgba(0,245,255,0.8);
}
#prompt::placeholder { color: rgba(255,255,255,0.2); }
#go {
  padding: 0 18px; height: 32px;
  background: rgba(0,245,255,0.15);
  border: 1px solid rgba(0,245,255,0.3);
  border-radius: 8px;
  color: rgba(0,245,255,0.9);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.2s;
  flex-shrink: 0;
}
#go:hover { background: rgba(0,245,255,0.25); }
#go:disabled { opacity: 0.4; cursor: default; }

/* ── HINT ── */
#hint {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%);
  font-size: 10px; color: rgba(255,255,255,0.15);
  letter-spacing: 2px; text-transform: uppercase;
  pointer-events: none; z-index: 10;
  text-align: center; white-space: nowrap;
}

/* ── TOAST ── */
#toast {
  position: fixed; top: 60px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  border: 1px solid rgba(0,245,255,0.3);
  padding: 8px 20px; border-radius: 8px;
  font-size: 11px; letter-spacing: 2px;
  color: rgba(0,245,255,0.8); text-transform: uppercase;
  opacity: 0; transition: opacity 0.3s;
  pointer-events: none; z-index: 100;
}
#toast.show { opacity: 1; }

/* ── CLEAR BTN ── */
#clear {
  position: fixed; top: 16px; right: 20px;
  z-index: 60;
  padding: 6px 12px;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px;
  color: rgba(255,255,255,0.3);
  font-family: 'DM Sans', sans-serif;
  font-size: 10px; letter-spacing: 1px;
  cursor: pointer; transition: all 0.2s;
  text-transform: uppercase;
}
#clear:hover { border-color: rgba(255,50,50,0.4); color: rgba(255,100,100,0.7); }

/* ── LOADING ── */
#loading {
  position: fixed; inset: 0; z-index: 200;
  background: #000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
  transition: opacity 0.6s;
}
.ld-ring {
  width: 36px; height: 36px;
  border: 1px solid rgba(0,245,255,0.2);
  border-top-color: rgba(0,245,255,0.8);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.ld-txt { font-size: 10px; letter-spacing: 4px; color: rgba(0,245,255,0.4); text-transform: uppercase; }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="corner c-tl"></div>
<div class="corner c-tr"></div>
<div class="corner c-bl"></div>
<div class="corner c-br"></div>

<div id="loading">
  <div class="ld-ring"></div>
  <div class="ld-txt">Hyperflex</div>
</div>

<div id="top">
  <div id="logo">Hyperflex</div>
  <div id="status">Drag to rotate · Scroll to zoom</div>
</div>

<button id="clear" onclick="clearAll()">Clear</button>
<div id="toast"></div>
<div id="hint">Describe anything and JARVIS will build it</div>

<div id="bottom">
  <div id="input-wrap">
    <div id="prefix">→</div>
    <input id="prompt" type="text" placeholder="a modern chair, a sports car, a drone, a robot..." autocomplete="off"/>
    <button id="go" onclick="build()">Build</button>
  </div>
</div>

<script>
// ── SCENE ──────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.1, 3000);
camera.position.set(0, 40, 220);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.shadowMap.enabled = true;

window.addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── LIGHTS ─────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x08101a, 4));
const key = new THREE.DirectionalLight(0xffffff, 3);
key.position.set(100, 200, 150); key.castShadow = true; scene.add(key);
const holo = new THREE.PointLight(0x00f5ff, 12, 500);
holo.position.set(0, 60, 80); scene.add(holo);
const fill = new THREE.PointLight(0x5500ff, 4, 400);
fill.position.set(-100, 80, -100); scene.add(fill);
const rim = new THREE.DirectionalLight(0x002244, 3);
rim.position.set(-80, 0, -120); scene.add(rim);

// ── GROUND REFLECT ─────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshStandardMaterial({ color: 0x000a14, metalness: 0.8, roughness: 0.9 })
);
ground.rotation.x = -Math.PI/2;
ground.position.y = -1;
ground.receiveShadow = true;
scene.add(ground);

// ── PIVOT ──────────────────────────────────────────────────
const pivot = new THREE.Object3D();
scene.add(pivot);

// ── OBJECTS ────────────────────────────────────────────────
let objects = {};
let objN = 0;

function makeGeo(type, size) {
  switch(type) {
    case 'sphere':   return new THREE.SphereGeometry(size/2, 48, 32);
    case 'box':      return new THREE.BoxGeometry(size, size, size);
    case 'cylinder': return new THREE.CylinderGeometry(size*.38, size*.38, size, 32);
    case 'cone':     return new THREE.ConeGeometry(size/2, size*1.4, 32);
    case 'torus':    return new THREE.TorusGeometry(size/2, size/7, 20, 60);
    case 'knot':     return new THREE.TorusKnotGeometry(size/3, size/10, 200, 32);
    default:         return new THREE.SphereGeometry(size/2, 48, 32);
  }
}

function makeMat(hex, metalness=0.85, roughness=0.12, emissive=0) {
  return new THREE.MeshStandardMaterial({
    color: hex, metalness, roughness,
    emissive: new THREE.Color(emissive),
    emissiveIntensity: emissive ? 1.5 : 0,
  });
}

function addObj(name, geo, mat, pos=[0,0,0], rot=[0,0,0]) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(...pos);
  mesh.rotation.set(...rot.map(r=>r*Math.PI/180));
  mesh.castShadow = true; mesh.receiveShadow = true;
  pivot.add(mesh);
  objects[name] = mesh;

  // spawn animation
  mesh.scale.set(0.01, 0.01, 0.01);
  let t = 0;
  const anim = setInterval(() => {
    t += 0.1; const s = Math.min(1, t);
    mesh.scale.set(s, s, s);
    if (s >= 1) clearInterval(anim);
  }, 16);
  return mesh;
}

function clearAll() {
  Object.values(objects).forEach(m => {
    pivot.remove(m); m.geometry.dispose(); m.material.dispose();
  });
  objects = {}; objN = 0;
  toast('Cleared');
}

// ── CAMERA CONTROL ─────────────────────────────────────────
let drag = false, px = 0, py = 0;
let rotX = 8, rotY = 0, tRotX = 8, tRotY = 0;
let zoom = 220, tZoom = 220;
const ease = 0.08;

canvas.addEventListener('mousedown', e => { drag=true; px=e.clientX; py=e.clientY; });
window.addEventListener('mouseup', () => drag=false);
window.addEventListener('mousemove', e => {
  if (!drag) return;
  tRotY += (e.clientX-px)*0.35;
  tRotX = Math.max(-70, Math.min(70, tRotX + (e.clientY-py)*0.25));
  px=e.clientX; py=e.clientY;
});
canvas.addEventListener('wheel', e => {
  tZoom = Math.max(60, Math.min(800, tZoom + e.deltaY * 0.4));
}, {passive:true});

// Touch
let tp = null;
canvas.addEventListener('touchstart', e => { tp={x:e.touches[0].clientX,y:e.touches[0].clientY}; });
canvas.addEventListener('touchmove', e => {
  if(!tp) return;
  tRotY += (e.touches[0].clientX-tp.x)*0.4;
  tRotX = Math.max(-70,Math.min(70,tRotX+(e.touches[0].clientY-tp.y)*0.3));
  tp={x:e.touches[0].clientX,y:e.touches[0].clientY};
});
canvas.addEventListener('touchend', () => tp=null);

// ── AI BUILD ───────────────────────────────────────────────
async function build() {
  const inp = document.getElementById('prompt');
  const cmd = inp.value.trim();
  if (!cmd) return;

  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = '...';
  document.getElementById('status').textContent = 'Building...';

  const token = localStorage.getItem('jarvis_token') || '';

  const sys = `You control a holographic 3D scene. Build "${cmd}" using primitive shapes.

Rules:
- Respond ONLY with raw JSON, no markdown, no backticks
- Use 8-25 parts for detail
- All parts sit ON the ground (Y >= half their height)
- Make objects recognizable and proportional
- Center the object around X=0, Z=0

JSON format:
{
  "parts": [
    {"name":"Seat","type":"box","color":4473924,"size":50,"pos":[0,12,0],"rot":[0,0,0],"metal":0.7,"rough":0.2},
    {"name":"Leg1","type":"cylinder","color":3355443,"size":8,"pos":[-20,6,-20],"rot":[0,0,0],"metal":0.9,"rough":0.1}
  ]
}

Types: box, sphere, cylinder, cone, torus, knot
Color is an integer (e.g. steel=6579300, white=15921906, black=1118481, red=13369344, blue=255, gold=16766720, chrome=14737400)
Size is diameter in scene units (30=small, 60=medium, 100=large)`;

  try {
    const res = await fetch('https://api.heyjarvis.me/design-command', {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${token}` },
      body: JSON.stringify({ command: cmd, systemPrompt: sys, history: [] })
    });

    const raw = await res.json();
    let data;

    // design-command tries JSON.parse — it might return the parts directly or wrapped
    if (raw.parts) {
      data = raw;
    } else if (raw.response) {
      const clean = raw.response.replace(/```json\n?/g,'').replace(/```\n?/g,'').trim();
      const match = clean.match(/\{[\s\S]*\}/);
      data = match ? JSON.parse(match[0]) : null;
    } else {
      data = raw;
    }

    if (!data?.parts?.length) throw new Error('No parts');

    clearAll();

    // Find bounding box to auto-center camera
    let maxY = 0;
    data.parts.forEach(p => {
      const y = (p.pos?.[1] || 0) + (p.size || 30)/2;
      if (y > maxY) maxY = y;
    });

    data.parts.forEach(p => {
      const geo = makeGeo(p.type || 'box', p.size || 30);
      const mat = makeMat(
        p.color || 0x4488ff,
        p.metal ?? 0.8,
        p.rough ?? 0.15,
        p.emissive || 0
      );
      addObj(p.name || ('Part_'+(++objN)), geo, mat, p.pos || [0,15,0], p.rot || [0,0,0]);
    });

    // Auto-frame camera
    tZoom = Math.max(120, maxY * 4);
    tRotX = 15; tRotY = 20;

    toast('Built: ' + cmd);
    document.getElementById('status').textContent = `${data.parts.length} parts · drag to rotate · scroll to zoom`;
    inp.value = '';

  } catch(e) {
    toast('Try again');
    document.getElementById('status').textContent = 'Drag to rotate · Scroll to zoom';
  }

  btn.disabled = false; btn.textContent = 'Build';
}

document.getElementById('prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter') build();
});

// ── TOAST ──────────────────────────────────────────────────
let tt;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove('show'), 2200);
}

// ── ANIMATE ────────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate); t += 0.008;
  rotX += (tRotX-rotX)*ease;
  rotY += (tRotY-rotY)*ease;
  zoom += (tZoom-zoom)*ease;
  pivot.rotation.x = rotX*Math.PI/180;
  pivot.rotation.y = rotY*Math.PI/180;
  camera.position.z = zoom;
  holo.intensity = 10 + Math.sin(t*1.8)*3;
  fill.intensity = 3 + Math.sin(t*1.2)*1;
  renderer.render(scene, camera);
}
animate();

// ── INIT ───────────────────────────────────────────────────
setTimeout(() => {
  const el = document.getElementById('loading');
  el.style.opacity = '0';
  setTimeout(() => el.style.display = 'none', 600);
}, 800);
</script>
</body>
</html>
