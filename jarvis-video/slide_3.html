<!DOCTYPE html>
<html>
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    width: 1920px;
    height: 1080px;
    background: radial-gradient(ellipse at center, #0a1628 0%, #000508 100%);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: 'Orbitron', monospace;
    overflow: hidden;
    position: relative;
}
.arc-reactor {
    position: absolute;
    width: 300px;
    height: 300px;
    border: 3px solid rgba(0, 170, 255, 0.3);
    border-radius: 50%;
}
.arc-reactor::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 200px;
    height: 200px;
    border: 2px solid rgba(0, 170, 255, 0.5);
    border-radius: 50%;
}
.arc-reactor::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, rgba(0, 170, 255, 0.8) 0%, transparent 70%);
    border-radius: 50%;
    box-shadow: 0 0 60px #00aaff, 0 0 120px #00aaff;
}
.content {
    position: relative;
    z-index: 10;
    text-align: center;
}
.title {
    font-size: 120px;
    font-weight: 900;
    color: #00aaff;
    text-shadow: 0 0 30px #00aaff, 0 0 60px #00aaff, 0 0 90px #0066cc;
    letter-spacing: 20px;
    margin-bottom: 30px;
}
.subtitle {
    font-family: 'Rajdhani', sans-serif;
    font-size: 48px;
    font-weight: 300;
    color: #ffffff;
    text-shadow: 0 0 20px rgba(255,255,255,0.5);
    letter-spacing: 8px;
    text-transform: uppercase;
}
.corner {
    position: absolute;
    width: 100px;
    height: 100px;
    border: 3px solid rgba(0, 170, 255, 0.5);
}
.corner.tl { top: 50px; left: 50px; border-right: none; border-bottom: none; }
.corner.tr { top: 50px; right: 50px; border-left: none; border-bottom: none; }
.corner.bl { bottom: 50px; left: 50px; border-right: none; border-top: none; }
.corner.br { bottom: 50px; right: 50px; border-left: none; border-top: none; }
.slide-number {
    position: absolute;
    bottom: 60px;
    right: 80px;
    font-size: 24px;
    color: rgba(0, 170, 255, 0.6);
    letter-spacing: 5px;
}
</style>
</head>
<body>
<div class="arc-reactor"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div class="content">
    <div class="title">CONNECTED EVERYWHERE</div>
    <div class="subtitle">Email. Calendar. YouTube. SMS.</div>
</div>
<div class="slide-number">04 / 08</div>
</body>
</html>
