<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>75042</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        h1 {
            color: #eee;
            margin-bottom: 20px;
            font-weight: 300;
            letter-spacing: 4px;
        }
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .toolbar button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            background: #16213e;
            color: #eee;
        }
        .toolbar button:hover {
            background: #0f3460;
            transform: translateY(-2px);
        }
        .toolbar input[type="color"] {
            width: 50px;
            height: 40px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .toolbar input[type="range"] {
            width: 100px;
            cursor: pointer;
        }
        label {
            color: #aaa;
            font-size: 14px;
        }
        canvas {
            border-radius: 12px;
            cursor: crosshair;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <h1>75042</h1>
    <div class="toolbar">
        <input type="color" id="colorPicker" value="#00ff88">
        <label>Size: <input type="range" id="brushSize" min="1" max="50" value="5"></label>
        <button id="eraser">Eraser</button>
        <button id="brush">Brush</button>
        <button id="clear">Clear</button>
        <button id="save">Save</button>
    </div>
    <canvas id="canvas" width="900" height="600"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const colorPicker = document.getElementById('colorPicker');
        const brushSize = document.getElementById('brushSize');
        
        // Set white background
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        let drawing = false;
        let currentColor = colorPicker.value;
        let isEraser = false;

        canvas.addEventListener('mousedown', (e) => {
            drawing = true;
            draw(e);
        });
        
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('mouseout', () => drawing = false);

        function draw(e) {
            if (!drawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            ctx.beginPath();
            ctx.arc(x, y, brushSize.value / 2, 0, Math.PI * 2);
            ctx.fillStyle = isEraser ? '#ffffff' : currentColor;
            ctx.fill();
        }

        colorPicker.addEventListener('input', (e) => {
            currentColor = e.target.value;
            isEraser = false;
        });

        document.getElementById('eraser').addEventListener('click', () => isEraser = true);
        document.getElementById('brush').addEventListener('click', () => isEraser = false);
        
        document.getElementById('clear').addEventListener('click', () => {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        });

        document.getElementById('save').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = '75042-drawing.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    </script>
</body>
</html>
