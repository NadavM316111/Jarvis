<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fdf6f0 0%, #fce4ec 50%, #e8f5e9 100%);
            min-height: 100vh;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .logo {
            font-family: 'Quicksand', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #8d6e63;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-bear { width: 45px; height: 45px; }
        .back-btn {
            background: linear-gradient(135deg, #ffcc80, #ffab91);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .back-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255, 171, 145, 0.4); }
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 50px 80px;
        }
        .page-header {
            text-align: center;
            margin-bottom: 60px;
        }
        .page-header h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 3rem;
            color: #5d4037;
            margin-bottom: 20px;
        }
        .page-header p {
            font-size: 1.2rem;
            color: #8d6e63;
            max-width: 700px;
            margin: 0 auto;
        }
        .diagram-container {
            background: white;
            border-radius: 30px;
            padding: 50px;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        .diagram-title {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            color: #5d4037;
            margin-bottom: 30px;
            text-align: center;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        .info-card {
            background: linear-gradient(135deg, #fff8f5 0%, #fce4ec 100%);
            padding: 30px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .info-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1); }
        .info-card h3 {
            color: #5d4037;
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info-card p { color: #6d4c41; line-height: 1.7; }
        .icon-circle {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ffcc80, #ffab91);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .svg-diagram { width: 100%; max-width: 900px; margin: 0 auto; display: block; }
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        .stat-item {
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-radius: 20px;
            min-width: 150px;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2e7d32;
        }
        .stat-label { color: #388e3c; font-weight: 600; }
        .code-block {
            background: #2d2d2d;
            border-radius: 15px;
            padding: 30px;
            overflow-x: auto;
            margin: 20px 0;
        }
        .code-block pre {
            color: #f8f8f2;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .keyword { color: #ff79c6; }
        .string { color: #f1fa8c; }
        .comment { color: #6272a4; }
        .function { color: #50fa7b; }
        footer {
            background: linear-gradient(135deg, #5d4037, #4e342e);
            color: white;
            padding: 40px;
            text-align: center;
            margin-top: 60px;
        }
        @media (max-width: 768px) {
            .content { padding: 100px 20px 60px; }
            .page-header h1 { font-size: 2rem; }
            nav { padding: 15px 20px; }
        }

</head>
