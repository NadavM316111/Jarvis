<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Interaction Flowchart - Sesami</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fdf6f0 0%, #fce4ec 50%, #e8f5e9 100%);
            min-height: 100vh;
        }
        nav {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        .logo {
            font-family: 'Quicksand', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #8d6e63;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-bear { width: 45px; height: 45px; }
        .back-btn {
            background: linear-gradient(135deg, #ffcc80, #ffab91);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .back-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255, 171, 145, 0.4); }
        .content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 120px 50px 80px;
        }
        .page-header {
            text-align: center;
            margin-bottom: 60px;
        }
        .page-header h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 3rem;
            color: #5d4037;
            margin-bottom: 20px;
        }
        .page-header p {
            font-size: 1.2rem;
            color: #8d6e63;
            max-width: 700px;
            margin: 0 auto;
        }
        .diagram-container {
            background: white;
            border-radius: 30px;
            padding: 50px;
            margin-bottom: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        .diagram-title {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            color: #5d4037;
            margin-bottom: 30px;
            text-align: center;
        }
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        .info-card {
            background: linear-gradient(135deg, #fff8f5 0%, #fce4ec 100%);
            padding: 30px;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        .info-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.1); }
        .info-card h3 {
            color: #5d4037;
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info-card p { color: #6d4c41; line-height: 1.7; }
        .icon-circle {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ffcc80, #ffab91);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .svg-diagram { width: 100%; max-width: 900px; margin: 0 auto; display: block; }
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-top: 40px;
        }
        .stat-item {
            text-align: center;
            padding: 25px;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            border-radius: 20px;
            min-width: 150px;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2e7d32;
        }
        .stat-label { color: #388e3c; font-weight: 600; }
        .code-block {
            background: #2d2d2d;
            border-radius: 15px;
            padding: 30px;
            overflow-x: auto;
            margin: 20px 0;
        }
        .code-block pre {
            color: #f8f8f2;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .keyword { color: #ff79c6; }
        .string { color: #f1fa8c; }
        .comment { color: #6272a4; }
        .function { color: #50fa7b; }
        footer {
            background: linear-gradient(135deg, #5d4037, #4e342e);
            color: white;
            padding: 40px;
            text-align: center;
            margin-top: 60px;
        }
        @media (max-width: 768px) {
            .content { padding: 100px 20px 60px; }
            .page-header h1 { font-size: 2rem; }
            nav { padding: 15px 20px; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="sesami.html" class="logo">
            <svg class="logo-bear" viewBox="0 0 100 100">
                <circle cx="25" cy="25" r="15" fill="#d7a574"/>
                <circle cx="75" cy="25" r="15" fill="#d7a574"/>
                <circle cx="25" cy="25" r="8" fill="#c49358"/>
                <circle cx="75" cy="25" r="8" fill="#c49358"/>
                <circle cx="50" cy="55" r="35" fill="#d7a574"/>
                <ellipse cx="50" cy="62" rx="18" ry="14" fill="#f5e1c0"/>
                <circle cx="38" cy="48" r="5" fill="#4a3520"/>
                <circle cx="62" cy="48" r="5" fill="#4a3520"/>
                <ellipse cx="50" cy="58" rx="6" ry="4" fill="#4a3520"/>
                <path d="M 44 66 Q 50 72 56 66" stroke="#4a3520" stroke-width="2" fill="none"/>
            </svg>
            Sesami
        </a>
        <a href="sesami.html" class="back-btn">Back to Home</a>
    </nav>
    <div class="content">
        
<div class="page-header">
    <h1>User Interaction Flowchart</h1>
    <p>The complete journey of how children and parents interact with Sesami.</p>
</div>
<div class="diagram-container">
    <h2 class="diagram-title">Child Interaction Flow</h2>
    <svg class="svg-diagram" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
        <!-- Start -->
        <ellipse cx="400" cy="40" rx="60" ry="25" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
        <text x="400" y="45" text-anchor="middle" font-size="12" fill="#2e7d32">Start</text>
        
        <!-- Wake Word -->
        <rect x="320" y="90" width="160" height="50" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
        <text x="400" y="120" text-anchor="middle" font-size="11" fill="#1565c0">Child says "Hey Sesami"</text>
        
        <!-- Decision: Wake word detected? -->
        <polygon points="400,170 460,210 400,250 340,210" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
        <text x="400" y="215" text-anchor="middle" font-size="10" fill="#e65100">Detected?</text>
        
        <!-- Listen for speech -->
        <rect x="320" y="280" width="160" height="50" rx="10" fill="#e3f2fd" stroke="#2196f3" stroke-width="2"/>
        <text x="400" y="310" text-anchor="middle" font-size="11" fill="#1565c0">Listen for speech</text>
        
        <!-- Process speech -->
        <rect x="320" y="360" width="160" height="50" rx="10" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
        <text x="400" y="390" text-anchor="middle" font-size="11" fill="#7b1fa2">Process with AI</text>
        
        <!-- Decision: Activity or Chat? -->
        <polygon points="400,440 480,490 400,540 320,490" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
        <text x="400" y="485" text-anchor="middle" font-size="10" fill="#e65100">Type?</text>
        
        <!-- Activity Path -->
        <rect x="150" y="465" width="130" height="50" rx="10" fill="#e8f5e9" stroke="#4caf50" stroke-width="2"/>
        <text x="215" y="495" text-anchor="middle" font-size="10" fill="#2e7d32">Start Activity</text>
        
        <!-- Chat Path -->
        <rect x="520" y="465" width="130" height="50" rx="10" fill="#fce4ec" stroke="#e91e63" stroke-width="2"/>
        <text x="585" y="495" text-anchor="middle" font-size="10" fill="#c2185b">Respond & Chat</text>
        
        <!-- Log Data -->
        <rect x="320" y="560" width="160" height="40" rx="10" fill="#e0f2f1" stroke="#26a69a" stroke-width="2"/>
        <text x="400" y="585" text-anchor="middle" font-size="10" fill="#00796b">Log to Analytics</text>
        
        <!-- Arrows -->
        <line x1="400" y1="65" x2="400" y2="90" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow4)"/>
        <line x1="400" y1="140" x2="400" y2="170" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow4)"/>
        <line x1="400" y1="250" x2="400" y2="280" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow4)"/>
        <line x1="400" y1="330" x2="400" y2="360" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow4)"/>
        <line x1="400" y1="410" x2="400" y2="440" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow4)"/>
        <line x1="320" y1="490" x2="280" y2="490" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow4)"/>
        <line x1="480" y1="490" x2="520" y2="490" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow4)"/>
        <line x1="215" y1="515" x2="215" y2="580" stroke="#90a4ae" stroke-width="2"/>
        <line x1="215" y1="580" x2="320" y2="580" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow4)"/>
        <line x1="585" y1="515" x2="585" y2="580" stroke="#90a4ae" stroke-width="2"/>
        <line x1="585" y1="580" x2="480" y2="580" stroke="#90a4ae" stroke-width="2" marker-end="url(#arrow4)"/>
        
        <!-- No path -->
        <line x1="340" y1="210" x2="250" y2="210" stroke="#ef5350" stroke-width="2"/>
        <line x1="250" y1="210" x2="250" y2="115" stroke="#ef5350" stroke-width="2"/>
        <line x1="250" y1="115" x2="320" y2="115" stroke="#ef5350" stroke-width="2" marker-end="url(#arrow4)"/>
        <text x="270" y="160" font-size="9" fill="#ef5350">No</text>
        <text x="440" y="235" font-size="9" fill="#4caf50">Yes</text>
        <text x="295" y="475" font-size="9" fill="#90a4ae">Activity</text>
        <text x="490" y="475" font-size="9" fill="#90a4ae">Chat</text>
        
        <defs>
            <marker id="arrow4" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#90a4ae"/>
            </marker>
        </defs>
    </svg>
</div>
    </div>
    <footer>
        <p>CIJE Innovation Day 2026 - Sesami by Nadav Minkowitz</p>
    </footer>
</body>
</html>
